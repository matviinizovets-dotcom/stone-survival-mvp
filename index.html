<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplayer Chat</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #171b22;
            --border: #2a3140;
            --text: #e8edf5;
            --muted: #8b95a7;
            --accent: #4ade80;
            --voice: #60a5fa;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Segoe UI, system-ui, sans-serif;
            background: radial-gradient(1200px 600px at 20% -10%, #1d2433 0%, var(--bg) 55%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .app {
            width: min(720px, 100%);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        header {
            padding: 18px 20px 12px;
            border-bottom: 1px solid var(--border);
        }
        header h1 {
            margin: 0 0 6px;
            font-size: 20px;
        }
        header p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }
        #chat-box {
            height: 380px;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .msg {
            background: #222833;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            max-width: 85%;
        }
        .msg .meta {
            font-size: 11px;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .composer {
            display: flex;
            gap: 8px;
            padding: 14px 16px 16px;
            border-top: 1px solid var(--border);
        }
        #message-input {
            flex: 1;
            background: #10141b;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
        }
        #message-input:focus { border-color: #3f4b63; }
        button {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 700;
            cursor: pointer;
        }
        #send-btn { background: var(--accent); color: #052e16; }
        #voice-btn { background: #1e3a5f; color: var(--voice); }
        #voice-btn:hover { background: #254a77; }
    </style>
</head>
<body>
    <main class="app">
        <header>
            <h1>Real-time Chat</h1>
            <p>Open two tabs at http://localhost:3000 to talk. Voice chat is a placeholder for later.</p>
        </header>

        <div id="chat-box" aria-live="polite"></div>

        <form class="composer" id="chat-form">
            <input id="message-input" type="text" maxlength="500" placeholder="Type a message..." autocomplete="off">
            <button id="send-btn" type="submit">Send</button>
            <button id="voice-btn" type="button" title="Coming soon">Voice</button>
        </form>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const chatBox = document.getElementById('chat-box');
        const form = document.getElementById('chat-form');
        const input = document.getElementById('message-input');
        const voiceBtn = document.getElementById('voice-btn');

        function addMessage(id, text) {
            const row = document.createElement('div');
            row.className = 'msg';
            row.innerHTML = `<div class="meta">${id}</div><div>${text}</div>`;
            chatBox.appendChild(row);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const text = input.value.trim();
            if (!text) return;
            socket.emit('chatMessage', text);
            input.value = '';
            input.focus();
        });

        socket.on('chatMessage', (payload) => {
            addMessage(payload.id, payload.text);
        });

        voiceBtn.addEventListener('click', () => {
            addMessage('system', 'Voice chat is not wired up yet.');
        });
    </script>
</body>
</html>
