<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Stone Age Sim — Prototype</title>
<style>
  /* ------------------------------------------------------------------
     Base reset. Full-bleed canvas so the game works identically on
     desktop browsers and mobile WebViews (important for the eventual
     Google Play / TWA wrapper).
  ------------------------------------------------------------------- */
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #1a1a1a;
    touch-action: none; /* prevents pull-to-refresh / scroll fighting future touch controls */
  }

  #game-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ------------------------------------------------------------------
     UI overlay layer. Kept empty/hidden for now — this is the mount
     point for the virtual joystick, inventory bar, and interaction
     prompts described in the architecture section below.
  ------------------------------------------------------------------- */
  #ui-root {
    position: fixed;
    inset: 0;
    pointer-events: none; /* children opt back in individually */
    font-family: sans-serif;
    color: #eee;
  }

  #debug-hud {
    position: absolute;
    top: 8px;
    left: 8px;
    font-size: 12px;
    background: rgba(0,0,0,0.4);
    padding: 6px 10px;
    border-radius: 4px;
    line-height: 1.4;
  }

  /* Virtual joystick (movement) — hidden on desktop, shown on touch
     devices by InputManager. pointer-events:auto re-enables touch on
     this element specifically, overriding #ui-root's pointer-events:none. */
  #joystick-zone {
    position: absolute;
    bottom: 40px;
    left: 40px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.06);
    display: none; /* shown by InputManager when a touch device is detected */
    pointer-events: auto;
    touch-action: none;
    transition: border-color 0.15s, background 0.15s;
  }

  /* Visual feedback when sprint is active */
  #joystick-zone.sprinting {
    border-color: rgba(255, 200, 80, 0.8);
    background: rgba(255, 200, 80, 0.12);
  }

  #joystick-stick {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 56px;
    height: 56px;
    margin: -28px 0 0 -28px; /* center on the zone's midpoint before any drag offset */
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    pointer-events: none; /* purely visual; the zone itself handles touches */
    transition: background 0.15s;
  }

  #joystick-zone.sprinting #joystick-stick {
    background: rgba(255, 200, 80, 0.7);
  }

  /* Jump button — same visibility rule as the joystick. */
  #jump-button {
    position: absolute;
    bottom: 55px;
    right: 40px;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-family: sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    display: none; /* shown by InputManager when a touch device is detected */
    align-items: center;
    justify-content: center;
    pointer-events: auto;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  #jump-button:active {
    background: rgba(255,255,255,0.25);
  }

  /* Sprint badge — small indicator above the joystick */
  #sprint-indicator {
    position: absolute;
    bottom: 180px;
    left: 40px;
    width: 130px;
    text-align: center;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: rgba(255, 200, 80, 0.0);
    pointer-events: none;
    transition: color 0.15s;
    text-shadow: 0 0 6px rgba(0,0,0,0.8);
  }

  #sprint-indicator.active {
    color: rgba(255, 200, 80, 0.95);
  }
</style>
</head>
<body>

<canvas id="game-canvas"></canvas>

<div id="ui-root">
  <div id="debug-hud">WASD move · Space jump · drag to rotate camera · scroll to zoom</div>
  <div id="joystick-zone"><div id="joystick-stick"></div></div>
  <div id="sprint-indicator">SPRINT</div>
  <div id="jump-button">JUMP</div>
</div>

<!-- ==================================================================
     Library imports via ES module import map.
     Three.js  -> rendering
     cannon-es -> physics (gravity, rigid bodies, collision)
     Pinning versions keeps the prototype reproducible.
=================================================================== -->
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import * as CANNON from "cannon-es";
import { FBXLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/FBXLoader.js";

/* --------------------------------------------------------------------
   Helper: builds an open cylinder and randomly extends the bottom ring
   downward per-segment, so cloth (loincloth/vest) reads as tattered
   hide rather than a perfectly clean geometric edge.
-------------------------------------------------------------------- */
function raggedClothGeometry(radiusTop, radiusBottom, height, radialSegments, raggedAmount) {
  const geo = new THREE.CylinderGeometry(radiusTop, radiusBottom, height, radialSegments, 1, true);
  const pos = geo.attributes.position;
  const bottomY = -height / 2;
  for (let i = 0; i < pos.count; i++) {
    if (Math.abs(pos.getY(i) - bottomY) < 1e-4) {
      pos.setY(i, bottomY - Math.random() * raggedAmount);
    }
  }
  pos.needsUpdate = true;
  geo.computeVertexNormals();
  return geo;
}

/* ====================================================================
   1. SCENE MANAGER
   Owns the renderer, camera, lights, sky, and static world geometry.
   Kept separate so environment art / terrain streaming can be swapped
   in later without touching character or input code.
==================================================================== */
class SceneManager {
  constructor() {
    this.scene = new THREE.Scene();

    // -----------------------------------------------------------------
    // SKY + ATMOSPHERE
    // -----------------------------------------------------------------
    // Instead of a flat background color, we render a vertical gradient
    // sky (deep blue at the zenith, warm hazy off-white at the horizon).
    // This is what makes the scene read as "outdoors" rather than
    // "inside a grey box". The gradient is painted onto a canvas and
    // used as both the scene background AND (via fog color) the far
    // clipping color, so the horizon and distance blend seamlessly.
    //
    // We also enable tone mapping so the sun and sky don't blow out to
    // pure white — ACES filmic is a good default for outdoor scenes.
    // -----------------------------------------------------------------
    this.HORIZON_COLOR = new THREE.Color(0xcfd8d0);   // warm hazy horizon
    this.ZENITH_COLOR  = new THREE.Color(0x6a99c4);   // soft daylight blue

    this.scene.background = this._makeSkyTexture();
    // Fog uses the horizon color so distant objects fade into the sky
    // instead of into an unrelated grey.
    this.scene.fog = new THREE.Fog(this.HORIZON_COLOR, 45, 140);

    this.camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      500
    );
    this.camera.position.set(0, 4, 8);

    const canvas = document.getElementById("game-canvas");
    this.renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.shadowMap.enabled = true;
    this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    // Filmic tone mapping + sRGB output for a natural-looking daylight
    // range. Without this, bright sky + bright sun are harsh and
    // over-saturated; with it, highlights roll off smoothly.
    this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
    this.renderer.toneMappingExposure = 1.05;
    this.renderer.outputColorSpace = THREE.SRGBColorSpace;

    this._setupLighting();
    this._setupGround();

    window.addEventListener("resize", () => this._onResize());
  }

  /* ------------------------------------------------------------------
     Vertical gradient sky texture. Drawn once onto a 2×512 canvas
     and used as scene.background. Three.js stretches this across the
     full viewport, which reads as a gradient sky from any angle.
  ------------------------------------------------------------------ */
  _makeSkyTexture() {
    const canvas = document.createElement("canvas");
    canvas.width = 2;
    canvas.height = 512;
    const ctx = canvas.getContext("2d");
    const grad = ctx.createLinearGradient(0, 0, 0, 512);
    // Top (zenith) — daylight blue
    grad.addColorStop(0.0, "#5e8fbd");
    grad.addColorStop(0.45, "#8fb2cd");
    // Horizon — warm hazy
    grad.addColorStop(0.75, "#c8d2cb");
    grad.addColorStop(1.0, "#dde1d3");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 2, 512);

    const tex = new THREE.CanvasTexture(canvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.magFilter = THREE.LinearFilter;
    tex.minFilter = THREE.LinearFilter;
    return tex;
  }

  _setupLighting() {
    // -----------------------------------------------------------------
    // HEMISPHERE LIGHT — cheap ambient that mimics sky/ground bounce.
    // Sky color is the same daylight blue as the top of the gradient;
    // ground color is a muted grass tone. This is what gives outdoor
    // scenes their characteristic "cool from above, warm from below"
    // fill, and replaces the flat AmbientLight entirely.
    // -----------------------------------------------------------------
    const hemi = new THREE.HemisphereLight(
      0xbdd4e8,   // sky color (matches gradient)
      0x4f5f38,   // ground bounce (muted grass/earth)
      0.85        // intensity
    );
    hemi.position.set(0, 30, 0);
    this.scene.add(hemi);
    this.hemiLight = hemi;

    // -----------------------------------------------------------------
    // SUN — DirectionalLight with properly-tuned shadows.
    //
    // Shadow setup notes:
    //  - The shadow camera frustum is sized to cover the visible play
    //    area so nothing in view is missed, but not larger (larger
    //    frustum = blurrier shadows for the same map resolution).
    //  - shadow.bias and shadow.normalBias together eliminate the
    //    self-shadow acne on sloped terrain without causing peter-
    //    panning (shadows detaching from their casters).
    //  - shadow.radius on PCFSoftShadowMap adds a soft blur to the
    //    edges. Higher = softer but noisier.
    // -----------------------------------------------------------------
    const sun = new THREE.DirectionalLight(0xfff2d6, 2.4);
    sun.position.set(35, 50, 20);        // late-morning angle
    sun.target.position.set(0, 0, 0);
    sun.castShadow = true;

    // Shadow map resolution. 2048 is a good balance; bump to 4096
    // for crisper shadows on high-end hardware.
    sun.shadow.mapSize.set(2048, 2048);

    // Frustum — a box around the origin wide enough to cover the
    // walkable area around the player.
    const shadowExtent = 55;
    sun.shadow.camera.left   = -shadowExtent;
    sun.shadow.camera.right  =  shadowExtent;
    sun.shadow.camera.top    =  shadowExtent;
    sun.shadow.camera.bottom = -shadowExtent;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far  = 180;

    // Depth-buffer bias to kill self-shadow acne on sloped surfaces.
    sun.shadow.bias = -0.0004;
    sun.shadow.normalBias = 0.03;

    // Softer PCF kernel — smoother shadow edges.
    sun.shadow.radius = 2.5;

    this.scene.add(sun);
    this.scene.add(sun.target);
    this.sun = sun;
  }

  _setupGround() {
    // Visual ground — a grass-covered plane, generated procedurally on
    // a canvas so no external texture files are required. The plane
    // itself is still flat at y = 0 (physics unchanged), but the
    // material now reads as a green prehistoric meadow instead of
    // bare dirt.
    const geo = new THREE.PlaneGeometry(200, 200, 1, 1);

    // Procedural grass texture: green base + many small blade strokes
    // in varied shades of green, plus a few darker patches for depth.
    const grassCanvas = document.createElement("canvas");
    grassCanvas.width = grassCanvas.height = 512;
    const gctx = grassCanvas.getContext("2d");

    // Base green fill.
    gctx.fillStyle = "#5a7a3a";
    gctx.fillRect(0, 0, 512, 512);

    // Large soft patches to break up the flatness (darker/lighter zones).
    for (let i = 0; i < 40; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const r = 30 + Math.random() * 70;
      const grad = gctx.createRadialGradient(x, y, 0, x, y, r);
      const dark = Math.random() < 0.5;
      grad.addColorStop(0, dark ? "rgba(40, 60, 25, 0.45)" : "rgba(140, 165, 80, 0.35)");
      grad.addColorStop(1, "rgba(0,0,0,0)");
      gctx.fillStyle = grad;
      gctx.beginPath();
      gctx.arc(x, y, r, 0, Math.PI * 2);
      gctx.fill();
    }

    // Grass blade strokes — short, slightly curved lines in varied
    // greens, dense enough to read as a grass mat at any zoom level.
    for (let i = 0; i < 22000; i++) {
      const x = Math.random() * 512;
      const y = Math.random() * 512;
      const len = 2 + Math.random() * 6;
      const tilt = (Math.random() - 0.5) * 3;
      const shade = Math.random();
      let col;
      if (shade < 0.3) col = `rgba(30, 55, 20, ${0.35 + Math.random() * 0.4})`;
      else if (shade < 0.7) col = `rgba(75, 120, 45, ${0.35 + Math.random() * 0.4})`;
      else col = `rgba(140, 175, 80, ${0.25 + Math.random() * 0.4})`;
      gctx.strokeStyle = col;
      gctx.lineWidth = 0.6 + Math.random() * 1.0;
      gctx.beginPath();
      gctx.moveTo(x, y);
      gctx.lineTo(x + tilt, y - len);
      gctx.stroke();
    }

    const grassTex = new THREE.CanvasTexture(grassCanvas);
    grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping;
    grassTex.colorSpace = THREE.SRGBColorSpace;
    grassTex.anisotropy = 8;
    // Tile the 512px canvas every 8 world units across the 200-unit
    // plane, so blade detail stays crisp without the pattern repeating
    // too visibly.
    grassTex.repeat.set(25, 25);

    const mat = new THREE.MeshStandardMaterial({
      map: grassTex,
      color: 0xffffff,
      roughness: 1,
      metalness: 0,
    });
    this.ground = new THREE.Mesh(geo, mat);
    this.ground.rotation.x = -Math.PI / 2;
    this.ground.receiveShadow = true;
    this.scene.add(this.ground);

    // A few boulder placeholders so the world doesn't look completely flat.
    const rockMat = new THREE.MeshStandardMaterial({ color: 0x777168, roughness: 0.9 });
    for (let i = 0; i < 12; i++) {
      const size = 0.4 + Math.random() * 1.2;
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(size, 0), rockMat);
      rock.position.set(
        (Math.random() - 0.5) * 60,
        size * 0.4,
        (Math.random() - 0.5) * 60
      );
      rock.rotation.set(Math.random(), Math.random(), Math.random());
      rock.castShadow = true;
      rock.receiveShadow = true;
      this.scene.add(rock);
    }
  }

  _onResize() {
    this.camera.aspect = window.innerWidth / window.innerHeight;
    this.camera.updateProjectionMatrix();
    this.renderer.setSize(window.innerWidth, window.innerHeight);
  }

  render() {
    this.renderer.render(this.scene, this.camera);
  }
}

/* ====================================================================
   2. PHYSICS MANAGER
   Wraps a cannon-es world. Keeping this isolated means the physics
   library itself (Rapier, cannon-es, etc.) can be swapped later
   without rewriting gameplay code — everything else talks to this
   class, not to CANNON directly.
==================================================================== */
class PhysicsManager {
  constructor() {
    this.world = new CANNON.World({ gravity: new CANNON.Vec3(0, -9.82, 0) });
    this.world.broadphase = new CANNON.SAPBroadphase(this.world);
    this.world.allowSleep = true;

    this.groundMaterial = new CANNON.Material("ground");
    this.characterMaterial = new CANNON.Material("character");
    this.treeMaterial = new CANNON.Material("tree");

    // A dedicated collision group for the ground lets a raycast target
    // "just the ground" directly (see Character#_isGrounded) instead of
    // relying on fragile start/end offset math to dodge the character's
    // own collider.
    this.GROUND_GROUP = 2;
    // Trees live in their own collision group so their own inter-tree
    // pairs can be skipped by the broadphase. They still collide with
    // the character (default group 1) and the ground (group 2).
    this.TREE_GROUP = 4;

    const contact = new CANNON.ContactMaterial(
      this.groundMaterial,
      this.characterMaterial,
      { friction: 0.4, restitution: 0.0 }
    );
    this.world.addContactMaterial(contact);

    // Character vs tree — slight bounce-back feel, some friction so
    // sliding along a trunk feels natural.
    const treeContact = new CANNON.ContactMaterial(
      this.treeMaterial,
      this.characterMaterial,
      { friction: 0.3, restitution: 0.0 }
    );
    this.world.addContactMaterial(treeContact);

    this._setupGroundBody();
  }

  _setupGroundBody() {
    const groundBody = new CANNON.Body({
      mass: 0, // static
      shape: new CANNON.Plane(),
      material: this.groundMaterial,
      collisionFilterGroup: this.GROUND_GROUP,
      // collisionFilterMask stays at its default (-1, "collide with
      // everything") so normal physics — the character resting on it,
      // etc. — is completely unaffected by this; only a raycast that
      // explicitly asks for GROUND_GROUP will treat this specially.
    });
    groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
    this.world.addBody(groundBody);
    this.groundBody = groundBody;
  }

  step(dt) {
    // Fixed-ish timestep with substeps for stability at variable frame rates.
    this.world.step(1 / 60, dt, 3);
  }
}

/* ====================================================================
   2b. TREE SYSTEM
   ------------------------------------------------------------------
   Procedural forest placed across the flat grassy plane.

   KEY DESIGN CHOICES:

   1) Instanced rendering. Each tree species is drawn with two
      InstancedMeshes — one for the trunk, one for the foliage. With
      three species that's six InstancedMeshes total, so the entire
      forest is 6 draw calls for the main pass and 6 for shadows. This
      scales to hundreds of trees essentially for free, which is why
      instancing was chosen over per-tree Meshes or LOD groups.

   2) Realistic-ish procedural geometry. Instead of flat billboards,
      trunks are cylinders and foliage is either a layered cone (for
      conifers) or a noise-displaced icosahedron (for leafy trees,
      which produces an irregular, organic canopy silhouette rather
      than a perfect sphere). Vertex normals are recomputed after
      displacement so the shading reacts correctly to the lumps.

   3) Density-weighted distribution. Rejection sampling with a
      distance-based accept probability: no trees inside the spawn
      clearing, sparse just outside it, increasingly dense further
      out. A large-scale noise term is layered on top so the forest
      forms clusters and clearings instead of a smooth gradient.

   4) Minimum-spacing rule. No two trees are closer than MIN_SPACING
      metres, so the forest doesn't turn into a solid wall of trunks.

   5) Static physics colliders. Each trunk gets one static
      CANNON.Cylinder body (character-height tall). Trunks are placed
      in TREE_GROUP so the broadphase skips tree-vs-tree pairs but
      still tests tree-vs-character. Foliage has no collider — the
      player walks under it.
==================================================================== */
class TreeSystem {
  constructor(scene, physics, opts = {}) {
    this.scene = scene;
    this.physics = physics;

    // --- Tunables ---
    this.TREE_COUNT    = opts.count       ?? 380;
    this.SPAWN_RADIUS  = opts.spawnRadius ?? 14;  // no trees closer than this
    this.MIN_SPACING   = opts.minSpacing  ?? 3.2; // minimum distance between any two trunks
    this.EXTENT        = opts.extent      ?? 90;  // half-width of the forest square

    this._species = this._defineSpecies();
    this._placements = [];
    this._instancedMeshes = [];

    this._generatePlacements();
    this._buildInstancedMeshes();
    this._addPhysicsColliders();
  }

  /* ------------------------------------------------------------------
     SPECIES DEFINITIONS
     Each species = one trunk geometry + one foliage geometry, with
     the Y-offsets baked into the geometry via .translate() so the
     InstancedMesh can place every tree at (x, 0, z) with a uniform
     scale and no per-instance Y bookkeeping.
  ------------------------------------------------------------------ */
  _defineSpecies() {
    // ---- Conifer (tall, layered cones) ----
    const coniferTrunk = new THREE.CylinderGeometry(0.14, 0.24, 4.5, 8);
    coniferTrunk.translate(0, 2.25, 0);

    const coniferFoliage = new THREE.ConeGeometry(1.8, 4.2, 10);
    coniferFoliage.translate(0, 5.0, 0);

    // ---- Round leafy tree (noise-displaced icosphere canopy) ----
    const roundTrunk = new THREE.CylinderGeometry(0.16, 0.26, 3.2, 8);
    roundTrunk.translate(0, 1.6, 0);

    const roundFoliage = this._noisySphere(2.2, 2, 0.18);
    roundFoliage.translate(0, 4.7, 0);

    // ---- Wide leafy tree (bigger, slightly squashed canopy) ----
    const wideTrunk = new THREE.CylinderGeometry(0.18, 0.30, 2.6, 8);
    wideTrunk.translate(0, 1.3, 0);

    const wideFoliage = this._noisySphere(2.7, 2, 0.20);
    wideFoliage.scale(1.0, 0.8, 1.0);
    wideFoliage.translate(0, 3.9, 0);

    return [
      {
        name: "conifer",
        trunkGeo: coniferTrunk,
        trunkMat: new THREE.MeshStandardMaterial({ color: 0x513a26, roughness: 1 }),
        foliageGeo: coniferFoliage,
        foliageMat: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }),
        // Foliage tint range (multiplied by the white material color).
        tintHue: [0.28, 0.34],   // deep greens
        tintSat: [0.45, 0.65],
        tintLight: [0.18, 0.28],
        trunkRadius: 0.24,       // for the physics collider
        trunkHeight: 4.5,
        weight: 0.55,
      },
      {
        name: "round",
        trunkGeo: roundTrunk,
        trunkMat: new THREE.MeshStandardMaterial({ color: 0x5c4127, roughness: 1 }),
        foliageGeo: roundFoliage,
        foliageMat: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }),
        tintHue: [0.25, 0.31],
        tintSat: [0.42, 0.62],
        tintLight: [0.24, 0.34],
        trunkRadius: 0.26,
        trunkHeight: 3.2,
        weight: 0.30,
      },
      {
        name: "wide",
        trunkGeo: wideTrunk,
        trunkMat: new THREE.MeshStandardMaterial({ color: 0x60462b, roughness: 1 }),
        foliageGeo: wideFoliage,
        foliageMat: new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1 }),
        tintHue: [0.22, 0.28],
        tintSat: [0.40, 0.60],
        tintLight: [0.28, 0.38],
        trunkRadius: 0.30,
        trunkHeight: 2.6,
        weight: 0.15,
      },
    ];
  }

  /* A smooth-shaded icosphere whose vertices are pushed in and out by
     a few overlapping sines. The result reads as an organic, lumpy
     canopy rather than a mathematically perfect sphere. */
  _noisySphere(radius, subdivisions, amount) {
    const geo = new THREE.IcosahedronGeometry(radius, subdivisions);
    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);
      const z = pos.getZ(i);
      // Layered sine noise — deterministic, cheap, no library needed.
      const n =
        Math.sin(x * 1.7 + 0.4) * Math.cos(y * 1.9 - 0.7) * Math.sin(z * 2.1 + 1.2) +
        0.5 * Math.sin(x * 3.4) * Math.cos(z * 3.1);
      const s = 1.0 + amount * n;
      pos.setXYZ(i, x * s, y * s, z * s);
    }
    pos.needsUpdate = true;
    geo.computeVertexNormals();
    return geo;
  }

  /* ------------------------------------------------------------------
     PLACEMENT — rejection sampling with density weighting.
  ------------------------------------------------------------------ */
  _generatePlacements() {
    const placements = [];
    // Compute cumulative weights for species selection.
    const totalWeight = this._species.reduce((s, sp) => s + sp.weight, 0);
    const cumulative = [];
    let acc = 0;
    for (const sp of this._species) {
      acc += sp.weight / totalWeight;
      cumulative.push(acc);
    }

    const maxAttempts = this.TREE_COUNT * 40;
    let attempts = 0;

    while (placements.length < this.TREE_COUNT && attempts < maxAttempts) {
      attempts++;

      const x = (Math.random() - 0.5) * 2 * this.EXTENT;
      const z = (Math.random() - 0.5) * 2 * this.EXTENT;
      const dist = Math.sqrt(x * x + z * z);

      // Reject anything inside the spawn clearing.
      if (dist < this.SPAWN_RADIUS) continue;

      // Distance-based density: 0 just outside spawn, ramping to 1
      // by ~50m out. Layered with a large-scale noise field so the
      // forest forms clusters and clearings rather than a smooth
      // radial gradient.
      const radial = Math.min(1, (dist - this.SPAWN_RADIUS) / 40);
      const noise  = 0.5 + 0.5 * Math.sin(x * 0.09 + 1.3) * Math.cos(z * 0.11 - 0.4);
      const acceptChance = 0.15 + 0.7 * radial * (0.6 + 0.4 * noise);
      if (Math.random() > acceptChance) continue;

      // Minimum spacing against already-placed trees.
      let tooClose = false;
      for (let i = 0; i < placements.length; i++) {
        const p = placements[i];
        const dx = p.x - x;
        const dz = p.z - z;
        const minD = this.MIN_SPACING;
        if (dx * dx + dz * dz < minD * minD) { tooClose = true; break; }
      }
      if (tooClose) continue;

      // Pick species from the weighted distribution.
      const r = Math.random();
      let speciesIndex = 0;
      for (let i = 0; i < cumulative.length; i++) {
        if (r <= cumulative[i]) { speciesIndex = i; break; }
      }

      placements.push({
        x,
        z,
        speciesIndex,
        scale: 0.75 + Math.random() * 0.75, // 0.75 .. 1.5
        rotY: Math.random() * Math.PI * 2,
        // Per-instance tint for the foliage.
        tint: this._randomTint(this._species[speciesIndex]),
      });
    }

    this._placements = placements;
  }

  _randomTint(species) {
    const [h0, h1] = species.tintHue;
    const [s0, s1] = species.tintSat;
    const [l0, l1] = species.tintLight;
    const c = new THREE.Color();
    c.setHSL(
      h0 + Math.random() * (h1 - h0),
      s0 + Math.random() * (s1 - s0),
      l0 + Math.random() * (l1 - l0)
    );
    return c;
  }

  /* ------------------------------------------------------------------
     BUILD INSTANCED MESHES
     One trunk InstancedMesh and one foliage InstancedMesh per species.
  ------------------------------------------------------------------ */
  _buildInstancedMeshes() {
    // Bucket placements by species.
    const buckets = this._species.map(() => []);
    for (const p of this._placements) {
      buckets[p.speciesIndex].push(p);
    }

    const mat4 = new THREE.Matrix4();
    const pos  = new THREE.Vector3();
    const quat = new THREE.Quaternion();
    const scl  = new THREE.Vector3();
    const upAxis = new THREE.Vector3(0, 1, 0);

    for (let si = 0; si < this._species.length; si++) {
      const sp = this._species[si];
      const list = buckets[si];
      if (list.length === 0) continue;

      // ---- Trunk ----
      const trunkMesh = new THREE.InstancedMesh(sp.trunkGeo, sp.trunkMat, list.length);
      trunkMesh.castShadow = true;
      trunkMesh.receiveShadow = true;
      trunkMesh.frustumCulled = true;

      // ---- Foliage ----
      const foliageMesh = new THREE.InstancedMesh(sp.foliageGeo, sp.foliageMat, list.length);
      foliageMesh.castShadow = true;
      foliageMesh.receiveShadow = true;
      foliageMesh.frustumCulled = true;

      for (let i = 0; i < list.length; i++) {
        const p = list[i];
        pos.set(p.x, 0, p.z);
        quat.setFromAxisAngle(upAxis, p.rotY);
        scl.setScalar(p.scale);
        mat4.compose(pos, quat, scl);

        trunkMesh.setMatrixAt(i, mat4);
        foliageMesh.setMatrixAt(i, mat4);
        foliageMesh.setColorAt(i, p.tint);
      }

      trunkMesh.instanceMatrix.needsUpdate = true;
      foliageMesh.instanceMatrix.needsUpdate = true;
      if (foliageMesh.instanceColor) foliageMesh.instanceColor.needsUpdate = true;

      this.scene.add(trunkMesh);
      this.scene.add(foliageMesh);
      this._instancedMeshes.push(trunkMesh, foliageMesh);
    }
  }

  /* ------------------------------------------------------------------
     PHYSICS COLLIDERS
     One static CANNON.Cylinder per trunk. Placed in TREE_GROUP so the
     broadphase skips tree-vs-tree pairs but still tests them against
     the character. Foliage has no collider.
  ------------------------------------------------------------------ */
  _addPhysicsColliders() {
    for (const p of this._placements) {
      const sp = this._species[p.speciesIndex];
      const radius = sp.trunkRadius * p.scale;
      const height = sp.trunkHeight * p.scale;

      const body = new CANNON.Body({
        mass: 0, // static
        shape: new CANNON.Cylinder(radius, radius, height, 8),
        material: this.physics.treeMaterial,
        collisionFilterGroup: this.physics.TREE_GROUP,
        // Only test against the character and the ground — skip
        // tree-vs-tree pairs entirely.
        collisionFilterMask: 1 | 2,
        position: new CANNON.Vec3(p.x, height / 2, p.z),
      });
      this.physics.world.addBody(body);
    }
  }
}

/* ====================================================================
   3. INPUT MANAGER
   Abstracts "what direction does the player want to move" away from
   the actual input device. Right now only keyboard (WASD/arrows) is
   implemented, but the same interface (getMoveVector / actionPressed)
   is what a virtual joystick + touch buttons will feed into later —
   gameplay code never needs to know which one is active.
==================================================================== */
class InputManager {
  constructor() {
    this.keys = Object.create(null);
    this._moveVector = new THREE.Vector2(); // keyboard-derived
    this._touchMoveVector = new THREE.Vector2(); // joystick-derived
    this._touchActive = false; // true while a finger is on the joystick
    this.interactPressed = false;
    this._jumpQueued = false; // consumed once per press/tap by Game's loop
    this._sprintActive = false; // toggled by double-tap on joystick center

    // Double-tap detection on the joystick center
    this._lastCenterTapTime = 0;
    this._centerTapThreshold = 300; // ms — max gap between two taps to count as double-tap
    this._centerTapMaxDistance = 18; // px — how close to center counts as "center"

    // Ensure the page/canvas actually holds keyboard focus. Without this,
    // keydown events can silently go nowhere (e.g. if the browser tab
    // gained focus on a different element), which looks exactly like
    // "WASD does nothing".
    const canvas = document.getElementById("game-canvas");
    canvas.setAttribute("tabindex", "0");
    canvas.style.outline = "none";
    canvas.focus();
    window.addEventListener("click", () => canvas.focus());

    window.addEventListener("keydown", (e) => this._onKey(e, true));
    window.addEventListener("keyup", (e) => this._onKey(e, false));

    // Show touch controls if we're on a touch-capable device.
    // This includes mobile browsers and some hybrid laptops.
    if ("ontouchstart" in window || navigator.maxTouchPoints > 0) {
      document.getElementById("joystick-zone").style.display = "block";
      document.getElementById("jump-button").style.display = "flex"; // flex keeps the text centered
      this._setupJoystick();
      this._setupJumpButton();
    }
  }

  _onKey(e, isDown) {
    // Only fire on the actual press, not on every repeat event the browser
    // sends while a key is held down — otherwise holding Space would queue
    // dozens of jumps per second.
    if (e.code === "Space" && isDown && !this.keys[e.code]) {
      this._jumpQueued = true;
    }
    // Shift toggles sprint on desktop too (single press toggles, like the
    // double-tap on mobile) — feels natural alongside WASD.
    if (e.code === "ShiftLeft" && isDown && !this.keys[e.code]) {
      this._sprintActive = !this._sprintActive;
      this._updateSprintVisuals();
    }
    this.keys[e.code] = isDown;
  }

  /** Returns true once per Space press/jump-button tap, then resets. */
  consumeJump() {
    const queued = this._jumpQueued;
    this._jumpQueued = false;
    return queued;
  }

  /** True while sprint mode is active (toggled by double-tap or Shift). */
  isSprinting() {
    return this._sprintActive;
  }

  /** Toggles the sprint flag and updates the joystick glow + badge. */
  _toggleSprint() {
    this._sprintActive = !this._sprintActive;
    this._updateSprintVisuals();
  }

  _updateSprintVisuals() {
    const zone = document.getElementById("joystick-zone");
    const indicator = document.getElementById("sprint-indicator");
    if (zone) zone.classList.toggle("sprinting", this._sprintActive);
    if (indicator) indicator.classList.toggle("active", this._sprintActive);
  }

  /**
   * Drag-anywhere-in-the-zone virtual joystick: touching down anywhere in
   * #joystick-zone re-centers the stick there (no need to precisely hit a
   * tiny knob), then dragging sets movement proportional to how far the
   * finger has moved from that point, clamped to the zone's radius.
   *
   * Sprint toggle: double-tapping near the joystick's center toggles
   * sprint on/off. The first tap of a double-tap must not be treated as
   * a normal joystick press, so a short delay is used to disambiguate —
   * if the finger lifts quickly and close to center, we wait briefly to
   * see whether a second tap follows before committing to "this was a
   * movement press".
   */
  _setupJoystick() {
    const zone = document.getElementById("joystick-zone");
    const stick = document.getElementById("joystick-stick");
    const maxRadius = 45; // px the stick can travel from center before clamping
    let touchId = null;
    let centerX = 0;
    let centerY = 0;
    let tapStartTime = 0;
    let tapStartX = 0;
    let tapStartY = 0;
    let movedFar = false; // did the finger leave the center dead-zone during this touch?
    // If we're waiting to see if a tap becomes a double-tap, block the
    // "reset stick" path so the joystick doesn't briefly snap back and
    // forth between taps.
    let pendingDoubleTap = false;

    const updateFromTouch = (touch) => {
      let dx = touch.clientX - centerX;
      let dy = touch.clientY - centerY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > maxRadius) {
        dx = (dx / dist) * maxRadius;
        dy = (dy / dist) * maxRadius;
      }
      stick.style.transform = `translate(${dx}px, ${dy}px)`;

      // x: right-positive, matching the "D" keyboard convention.
      // y: dy is negative when the finger moves up the screen, and "up"
      // should mean forward — which is already negative in our convention
      // (W sets y -= 1) — so no sign flip needed here.
      this._touchMoveVector.set(dx / maxRadius, dy / maxRadius);
      this._touchActive = true;
    };

    const resetStick = () => {
      stick.style.transform = "translate(0px, 0px)";
      this._touchMoveVector.set(0, 0);
      this._touchActive = false;
      touchId = null;
      movedFar = false;
    };

    const isNearCenter = (clientX, clientY) => {
      const dx = clientX - centerX;
      const dy = clientY - centerY;
      return Math.sqrt(dx * dx + dy * dy) <= this._centerTapMaxDistance;
    };

    zone.addEventListener(
      "touchstart",
      (e) => {
        const touch = e.changedTouches[0];
        // If a double-tap is pending and a new touch lands, resolve it
        // immediately as a fresh touch (not part of a double-tap).
        if (pendingDoubleTap) {
          pendingDoubleTap = false;
        }

        touchId = touch.identifier;
        const rect = zone.getBoundingClientRect();
        centerX = rect.left + rect.width / 2;
        centerY = rect.top + rect.height / 2;

        tapStartTime = performance.now();
        tapStartX = touch.clientX;
        tapStartY = touch.clientY;
        movedFar = false;

        updateFromTouch(touch);
        e.preventDefault();
      },
      { passive: false }
    );

    window.addEventListener(
      "touchmove",
      (e) => {
        if (touchId === null) return;
        for (const touch of e.changedTouches) {
          if (touch.identifier === touchId) {
            // Track whether the finger has moved meaningfully away from
            // where it landed — if so, this is a drag, not a tap.
            const dx = touch.clientX - tapStartX;
            const dy = touch.clientY - tapStartY;
            if (Math.sqrt(dx * dx + dy * dy) > 12) movedFar = true;
            updateFromTouch(touch);
            e.preventDefault();
          }
        }
      },
      { passive: false }
    );

    const onTouchEnd = (e) => {
      for (const touch of e.changedTouches) {
        if (touch.identifier !== touchId) continue;

        const now = performance.now();
        const tapDuration = now - tapStartTime;
        const wasQuickTap = !movedFar && tapDuration < 250;
        const landedNearCenter = isNearCenter(tapStartX, tapStartY);

        if (wasQuickTap && landedNearCenter) {
          // This could be the first or second tap of a double-tap.
          const sinceLastTap = now - this._lastCenterTapTime;
          if (sinceLastTap < this._centerTapThreshold) {
            // Second tap within the window → toggle sprint, and don't
            // treat this as a movement release.
            this._toggleSprint();
            this._lastCenterTapTime = 0; // reset so a third tap starts a new pair
            pendingDoubleTap = false;
            resetStick();
          } else {
            // First tap — record the time, and hold off on resetting the
            // stick for a moment in case a second tap arrives. During that
            // short window, movement stays active (finger lifted but
            // joystick reads last-known direction) — this avoids a visible
            // stutter between the two taps.
            this._lastCenterTapTime = now;
            pendingDoubleTap = true;
            // Resolve after the threshold: if no second tap arrived, this
            // was just a quick tap on the center — release as normal.
            setTimeout(() => {
              if (pendingDoubleTap) {
                pendingDoubleTap = false;
                resetStick();
              }
            }, this._centerTapThreshold);
            // Keep touchId set so a same-finger second tap is still tracked,
            // but mark it as released so a new touchstart can re-acquire.
            touchId = null;
          }
        } else {
          // Not a tap — normal drag release.
          resetStick();
        }
      }
    };
    window.addEventListener("touchend", onTouchEnd);
    window.addEventListener("touchcancel", onTouchEnd);
  }

  _setupJumpButton() {
    const button = document.getElementById("jump-button");
    button.addEventListener(
      "touchstart",
      (e) => {
        this._jumpQueued = true;
        e.preventDefault();
      },
      { passive: false }
    );
    // Also handle mouse click for desktop testing
    button.addEventListener("mousedown", (e) => {
      this._jumpQueued = true;
      e.preventDefault();
    });
  }

  /** Returns a normalized Vector2: x = left/right, y = forward/back. */
  getMoveVector() {
    // The joystick and keyboard are mutually exclusive in practice (one
    // device or the other), so whichever is actively being used wins —
    // the joystick taking priority while a finger is actually on it.
    if (this._touchActive) {
      return this._touchMoveVector;
    }

    let x = 0;
    let y = 0;
    if (this.keys["KeyW"] || this.keys["ArrowUp"]) y -= 1;
    if (this.keys["KeyS"] || this.keys["ArrowDown"]) y += 1;
    if (this.keys["KeyA"] || this.keys["ArrowLeft"]) x -= 1;
    if (this.keys["KeyD"] || this.keys["ArrowRight"]) x += 1;

    // IMPORTANT: always write the vector, including (0, 0) — previously
    // this only updated when x or y was nonzero, so releasing every key
    // left the last pressed direction stuck in the vector forever.
    this._moveVector.set(x, y);
    if (this._moveVector.lengthSq() > 0) this._moveVector.normalize();
    return this._moveVector;
  }
}

/* ====================================================================
   4. CHARACTER
   The player-controlled caveman. Visually this is a capsule + a
   couple of primitives standing in for the base clothing (a simple
   wrap around the torso/hips), matching the approved base-clothing
   rule: the character is never fully nude and this base garment is
   not a removable inventory item. Replace the placeholder mesh with
   the final rigged model later — the physics/movement code below
   doesn't care what the visual mesh looks like.
==================================================================== */
class Character {
  constructor(sceneManager, physicsManager) {
    this.scene = sceneManager.scene;
    this.physics = physicsManager;

    this._buildMesh();
    this._buildPhysicsBody();

    // Movement tuning
    this.walkSpeed = 18; // meters/sec — normal movement
    this.sprintSpeed = 30; // meters/sec — sprint (toggled by double-tap / Shift)
    this.rotationLerpSpeed = 10; // higher = snappier turning
    this.jumpSpeed = 5.5; // upward velocity applied on jump, in meters/sec
    this._targetQuaternion = new THREE.Quaternion();
    this._walkCycleTime = 0;
    this._swingAmount = 0; // eased 0..1, how "into" the walk cycle the placeholder is
    this._isSprinting = false; // reflects InputManager#isSprinting each frame

    // Facing: the character now rotates to face the direction of travel
    // (camera-relative), not the camera's forward. We keep a persistent
    // yaw value and ease it toward the movement direction's yaw so the
    // turn is smooth instead of snapping.
    this._currentYaw = 0;

    // Airborne speed cap. Set at the moment of takeoff, enforced every
    // frame while airborne. This is what prevents the mid-air speed
    // boost bug — horizontal speed may never exceed whatever it was
    // when the character left the ground.
    this._airborneSpeedCap = 0;
  }

  _buildMesh() {
    this.mesh = new THREE.Group();
    // All coordinates below are relative to the group origin, which sits
    // exactly at the character's feet on the ground plane.
    this._proceduralParts = [];
    this._buildProceduralPlaceholder();
    this._tryLoadFbxModel();
    this.scene.add(this.mesh);
  }

  /**
   * Synchronous placeholder built entirely from primitive geometry.
   * NOTE ON FIDELITY: this can approximate a silhouette (limbs, hip wrap,
   * beard, hair) but primitives cannot reproduce a sculpted, textured
   * character render like reference concept art — that level of detail
   * requires an actual modeled/rigged asset (Blender/ZBrush sculpt, or a
   * Mixamo/Sketchfab/asset-store humanoid). This placeholder exists so
   * physics and movement are testable before that asset exists.
   */
  _buildProceduralPlaceholder() {
    const group = this.mesh;
    const skinMat = new THREE.MeshStandardMaterial({ color: 0x9c7854, roughness: 0.85 });
    const hideMat = new THREE.MeshStandardMaterial({ color: 0x6f5a3f, roughness: 1 }); // fur/hide clothing
    const hairMat = new THREE.MeshStandardMaterial({ color: 0x352519, roughness: 1 });

    const addPart = (mesh) => {
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      group.add(mesh);
      this._proceduralParts.push(mesh);
      return mesh;
    };

    // ---- Legs (bare) ----
    const legHeight = 0.85;
    const hipY = legHeight; // top of the legs / pivot height
    const legGeo = new THREE.CylinderGeometry(0.115, 0.095, legHeight, 8);
    // Legs pivot from the hip, not their own center, so raise the geometry
    // and offset a wrapper group instead — that lets rotation.x swing the
    // leg forward/back like an actual stride rather than spinning in place.
    legGeo.translate(0, -legHeight / 2, 0);
    this.legs = [-0.13, 0.13].map((x) => {
      const pivot = new THREE.Group();
      pivot.position.set(x, hipY, 0);
      const leg = new THREE.Mesh(legGeo, skinMat);
      leg.castShadow = true;
      leg.receiveShadow = true;
      pivot.add(leg);
      group.add(pivot);
      this._proceduralParts.push(pivot);
      return pivot;
    });

    // ---- Pants (base clothing, non-removable — see hip wrap note below) ----
    // Built as a child of each leg's pivot group so they swing together
    // with the leg during the walk cycle instead of staying static.
    const pantsHeight = 0.62; // hip to mid-shin
    const pantsGeo = raggedClothGeometry(0.145, 0.125, pantsHeight, 8, 0.06);
    pantsGeo.translate(0, -pantsHeight / 2, 0); // top of geometry sits at the hip pivot
    this.legs.forEach((legPivot) => {
      const pants = new THREE.Mesh(pantsGeo, hideMat);
      pants.castShadow = true;
      pants.receiveShadow = true;
      pants.name = "base_wrap";
      legPivot.add(pants);
      this._proceduralParts.push(pants);
    });

    // ---- Torso ----
    const torsoGeo = new THREE.CapsuleGeometry(0.26, 0.34, 4, 8);
    const torso = addPart(new THREE.Mesh(torsoGeo, skinMat));
    const torsoCenterY = hipY + 0.26 + 0.34 / 2;
    torso.position.y = torsoCenterY;

    // ---- Arms — hanging close to the body, pivoting from the shoulder ----
    const armLength = 0.6;
    const armGeo = new THREE.CylinderGeometry(0.08, 0.07, armLength, 8);
    armGeo.translate(0, -armLength / 2, 0);
    const shoulderY = torsoCenterY + 0.3;
    this.arms = [-1, 1].map((side) => {
      const pivot = new THREE.Group();
      pivot.position.set(side * 0.32, shoulderY, 0);
      const arm = new THREE.Mesh(armGeo, skinMat);
      arm.castShadow = true;
      arm.receiveShadow = true;
      arm.rotation.z = side * 0.12; // slight outward angle only
      pivot.add(arm);
      group.add(pivot);
      this._proceduralParts.push(pivot);
      return pivot;
    });

    // ---- Head ----
    const headRadius = 0.21;
    const headY = shoulderY + headRadius + 0.06;
    const head = addPart(new THREE.Mesh(new THREE.SphereGeometry(headRadius, 14, 14), skinMat));
    head.position.y = headY;

    // Shaggy, fuller hair mass.
    const hair = addPart(new THREE.Mesh(new THREE.SphereGeometry(headRadius * 1.15, 12, 12), hairMat));
    hair.position.set(0, headY + 0.06, -0.04);
    hair.scale.set(1.05, 0.9, 1.1);

    // Full beard reaching toward the chest.
    const beard = addPart(new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.42, 8), hairMat));
    beard.rotation.x = Math.PI;
    beard.position.set(0, headY - 0.2, 0.13);

    // ---- Base clothing (permanent — excluded from the removable-inventory system) ----
    // Hip wrap with a tattered bottom edge instead of a clean cut.
    const wrap = addPart(
      new THREE.Mesh(raggedClothGeometry(0.35, 0.32, 0.5, 10, 0.14), hideMat)
    );
    wrap.position.y = hipY + 0.08;
    wrap.name = "base_wrap";

    // Chest patch + diagonal shoulder strap, echoing the vest in the reference art.
    const chestPatch = addPart(
      new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.32, 8, 1, true, 0.5, 3.3), hideMat)
    );
    chestPatch.position.y = torsoCenterY;
    chestPatch.name = "base_wrap";

    const strap = addPart(new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.55, 0.06), hideMat));
    strap.position.set(-0.12, torsoCenterY + 0.15, 0.05);
    strap.rotation.z = 0.5;
    strap.name = "base_wrap";
  }

  /**
   * Production path: loads the real character model (Ch36_nonPBR.fbx)
   * and swaps it in for the procedural placeholder above. The four walk
   * clips are Mixamo exports of a *different* character, but since all
   * of them (Ch36 included, if it's also a Mixamo/standard-rig asset)
   * share the same bone-naming convention, their animation tracks
   * retarget cleanly onto Ch36's skeleton — so we load Ch36 for its
   * mesh only, and each animation file for its clip only.
   */
  _tryLoadFbxModel() {
    const modelPath = "./assets/models/Ch36_nonPBR.fbx";
    const animBasePath = "./assets/animations/";
    const loader = new FBXLoader();

    loader.load(
      modelPath,
      (fbx) => {
        // Found the real model: remove the placeholder primitives.
        this._proceduralParts.forEach((part) => this.mesh.remove(part));
        this._proceduralParts = [];

        // Mixamo/standard FBX exports are ~100x too large by default
        // (centimeters, not meters) — scale down to match the world.
        fbx.scale.setScalar(0.01);
        fbx.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        this.mesh.add(fbx);
        this.realModel = fbx;
        this.mixer = new THREE.AnimationMixer(fbx);
        this.locomotionActions = {};
        this._setupPantsRig(fbx);

        // Pull each gait clip from its own file, ignoring whatever mesh
        // that file itself carries — we only want the animation track.
        const clipFiles = [
          { key: "walk", file: "Walking.fbx" },
          { key: "walkBack", file: "Walking_Backwards.fbx" },
          { key: "strafeLeft", file: "Left_Strafe_Walking.fbx" },
          { key: "strafeRight", file: "Right_Strafe_Walking.fbx" },
        ];
        clipFiles.forEach(({ key, file }) => {
          loader.load(
            animBasePath + file,
            (clipFbx) => {
              if (clipFbx.animations[0]) {
                this.locomotionActions[key] = this.mixer.clipAction(clipFbx.animations[0]);
              }
            },
            undefined,
            () => {
              // That one direction just won't animate if its file is missing.
            }
          );
        });
      },
      undefined,
      () => {
        // No FBX found at modelPath — keep the procedural placeholder.
        // NOTE: if Ch36's textures don't appear once it loads, it likely
        // references external image files that need to sit alongside it
        // in assets/models/ — re-export with embedded media if possible.
      }
    );
  }

  _buildPhysicsBody() {
    // Capsule shape isn't native to cannon-es, so we approximate with a
    // single cylinder collider roughly spanning feet-to-shoulders — enough
    // for stable ground movement in this prototype.
    this.colliderRadius = 0.3;
    this.colliderHeight = 1.3;
    const shape = new CANNON.Cylinder(this.colliderRadius, this.colliderRadius, this.colliderHeight, 8);

    this.body = new CANNON.Body({
      mass: 70, // kg, roughly human
      position: new CANNON.Vec3(0, 2, 0), // spawn slightly above ground
      material: this.physics.characterMaterial,
      // NOTE: this damps ALL axes, including vertical — 0.9 was crushing
      // jump velocity almost immediately (looked like "jumping doesn't
      // work"). Horizontal stopping is already handled manually below via
      // an explicit decel in Character#update, so this just needs to curb
      // tiny residual drift, not do the actual stopping.
      linearDamping: 0.05,
      fixedRotation: true, // we drive facing direction manually via the mesh
    });
    this.body.addShape(shape);

    // IMPORTANT: cannon-es lets resting bodies fall asleep to save CPU.
    // Once asleep, directly setting body.velocity has no effect until the
    // body wakes up again — from the outside this looks exactly like
    // "the character stopped responding to input". Since this body is
    // always player-controlled, just keep it awake permanently.
    this.body.allowSleep = false;

    this.physics.world.addBody(this.body);
  }

  /**
   * Finds a skeleton bone by the tail of its name, ignoring whatever
   * namespace prefix the rig uses (this model's is "mixamorig1:", but
   * other Mixamo exports use "mixamorig:" — matching on the suffix
   * keeps this working either way, or if a different model is swapped
   * in later).
   */
  _findBone(root, suffix) {
    const target = suffix.toLowerCase();
    let found = null;
    root.traverse((obj) => {
      if (found || !obj.isBone) return;
      if (obj.name.toLowerCase().endsWith(target)) found = obj;
    });
    return found;
  }

  /**
   * Builds simple pants: cylinder segments stretched between each leg's
   * joints every frame (see _updatePantsRig). These are NOT skinned to
   * the mesh — they're rigidly re-fit to bone positions each frame — so
   * they won't deform like real cloth, but they do correctly follow the
   * thigh/shin through the walk and strafe animations. Real per-vertex
   * cloth deformation would require an actual weight-painted garment
   * built in Blender/Maya against this skeleton.
   */
  _setupPantsRig(fbx) {
    const leftUpLeg = this._findBone(fbx, "leftupleg");
    const leftLeg = this._findBone(fbx, "leftleg");
    const leftFoot = this._findBone(fbx, "leftfoot");
    const rightUpLeg = this._findBone(fbx, "rightupleg");
    const rightLeg = this._findBone(fbx, "rightleg");
    const rightFoot = this._findBone(fbx, "rightfoot");
    const hips = this._findBone(fbx, "hips");

    if (!leftUpLeg || !leftLeg || !rightUpLeg || !rightLeg) {
      // Couldn't identify a recognizable leg skeleton — skip rather than
      // guess wrong and place geometry somewhere nonsensical.
      return;
    }

    const hideMat = new THREE.MeshStandardMaterial({ color: 0x6f5a3f, roughness: 1 });
    const makeSegment = (radiusTop, radiusBottom) => {
      // Unit height along local +Y — stretched to the real bone-to-bone
      // distance every frame, so exact length doesn't matter here.
      const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radiusTop, radiusBottom, 1, 10), hideMat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      // Added at world scope, not bone-parented — _updatePantsRig sets
      // world position/rotation/scale directly from live bone positions.
      this.scene.add(mesh);
      return mesh;
    };

    const segmentDefs = [
      { boneA: leftUpLeg, boneB: leftLeg, rTop: 0.155, rBot: 0.135 }, // left thigh
      { boneA: rightUpLeg, boneB: rightLeg, rTop: 0.155, rBot: 0.135 }, // right thigh
    ];
    if (leftFoot) segmentDefs.push({ boneA: leftLeg, boneB: leftFoot, rTop: 0.135, rBot: 0.115 }); // left shin
    if (rightFoot) segmentDefs.push({ boneA: rightLeg, boneB: rightFoot, rTop: 0.135, rBot: 0.115 }); // right shin

    this.pantsSegments = segmentDefs.map(({ boneA, boneB, rTop, rBot }) => ({
      mesh: makeSegment(rTop, rBot),
      boneA,
      boneB,
    }));

    if (hips) {
      // Waist band — a single-bone attachment (no second joint to stretch
      // toward), so it just tracks the hip bone's position/rotation directly.
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.22, 12), hideMat);
      band.castShadow = true;
      band.receiveShadow = true;
      this.scene.add(band);
      this.pantsSegments.push({ mesh: band, boneA: hips, boneB: null });
    }
  }

  /** Re-fits every pants segment to its live bone position each frame. */
  _updatePantsRig() {
    if (!this.pantsSegments) return;
    const up = new THREE.Vector3(0, 1, 0);
    this.pantsSegments.forEach(({ mesh, boneA, boneB }) => {
      const posA = new THREE.Vector3();
      boneA.getWorldPosition(posA);
      if (boneB) {
        const posB = new THREE.Vector3();
        boneB.getWorldPosition(posB);
        const dir = new THREE.Vector3().subVectors(posB, posA);
        const length = dir.length() || 0.0001;
        dir.normalize();
        mesh.position.copy(posA).addScaledVector(dir, length / 2);
        mesh.quaternion.setFromUnitVectors(up, dir);
        mesh.scale.set(1, length, 1);
      } else {
        mesh.position.copy(posA);
        boneA.getWorldQuaternion(mesh.quaternion);
      }
    });
  }
  /**
   * A short downward raycast from the body center tells us whether the
   * character is actually standing on something right now — checking
   * velocity instead (e.g. "is vertical speed near zero") gets this wrong
   * the instant you land, and would let you jump again in mid-air.
   */
  _isGrounded() {
    // NOTE: this used to be a raycast against the ground body. Debug
    // logging showed it reporting `false` 100% of the time even while
    // resting exactly at the expected height (y = 0.650) — cannon-es's
    // raycastClosest relies on its broadphase's cached per-body AABBs,
    // and static bodies (mass: 0, like our ground) appear to not get
    // reliable AABBs computed for this purpose (this matches a known
    // open issue in the cannon-es tracker: raycasts failing to detect
    // static bodies at their correct position).
    //
    // Workaround: since the ground is a known flat plane at y = 0 (not
    // varied terrain), we don't need a raycast at all — "grounded" just
    // means resting at that known height and not currently moving
    // upward. This would need revisiting if ramps/platforms are added
    // later, at which point a raycast against DYNAMIC bodies only (or a
    // library upgrade) would be worth retrying.
    const restingHeight = this.colliderHeight / 2;
    const EPSILON = 0.05;
    return this.body.position.y <= restingHeight + EPSILON && this.body.velocity.y <= 0.01;
  }

  /** Applies an upward velocity if (and only if) currently grounded. */
  jump() {
    const grounded = this._isGrounded(); // TEMP: captured separately so we can log it below
    console.log("[DEBUG] jump() called. grounded =", grounded, "| body.position.y =", this.body.position.y.toFixed(3), "| velocity.y before =", this.body.velocity.y.toFixed(3)); // TEMP
    if (grounded) {
      // Snapshot the exact horizontal speed at takeoff. This is the hard
      // ceiling for the entire airborne phase — no input, sprint toggle,
      // or camera rotation can push the character past it while airborne.
      this._airborneSpeedCap = Math.sqrt(
        this.body.velocity.x * this.body.velocity.x +
        this.body.velocity.z * this.body.velocity.z
      );
      // If jumping from a near standstill, allow mid-air steering up to
      // walk speed so the player isn't locked in place.
      if (this._airborneSpeedCap < 0.5) {
        this._airborneSpeedCap = this.walkSpeed;
      }
      this.body.velocity.y = this.jumpSpeed;
      console.log("[DEBUG] velocity.y set to", this.jumpSpeed); // TEMP
    }
  }

  update(moveVector, camera, dt, sprinting = false) {
    this._isSprinting = sprinting;
    const hasInput = moveVector.lengthSq() > 0.0001;
    const speed = sprinting ? this.sprintSpeed : this.walkSpeed;

    // Grounded check up front — used to decide which movement branch
    // runs and to enforce the airborne speed cap.
    const grounded = this._isGrounded();

    // --- Camera-relative basis on the XZ plane -----------------------
    // camForward is the direction the camera is looking, flattened to
    // the ground plane. camRight is perpendicular to it (forward × up).
    // Both are recomputed every frame so the player's movement frame
    // tracks whatever the camera is currently doing — including while
    // the player is mid-drag rotating the camera.
    const camForward = new THREE.Vector3();
    camera.getWorldDirection(camForward);
    camForward.y = 0;
    camForward.normalize();
    // cross(forward, up) already points to the camera's right — no .negate()
    // needed (that was the bug: it silently swapped A and D).
    const camRight = new THREE.Vector3().crossVectors(camForward, THREE.Object3D.DEFAULT_UP);

    if (hasInput) {
      // Build the world-space movement direction from the camera basis:
      //   -moveVector.y  → forward (W = -1 in screen space)
      //   +moveVector.x  → right  (D = +1 in screen space)
      // Then normalize so diagonal input doesn't move faster than
      // cardinal input.
      const moveDir = new THREE.Vector3();
      moveDir.addScaledVector(camForward, -moveVector.y);
      moveDir.addScaledVector(camRight, moveVector.x);
      moveDir.normalize();

      const targetVx = moveDir.x * speed;
      const targetVz = moveDir.z * speed;

      if (grounded) {
        // Ground: set horizontal velocity directly — full speed, full
        // directional control, exactly as before.
        this.body.velocity.x = targetVx;
        this.body.velocity.z = targetVz;
      } else {
        // Air: blend toward the same target at reduced authority, then
        // hard-cap the resulting magnitude to the takeoff snapshot so
        // the character can't accelerate past what they had when they
        // left the ground.
        const airLerp = 1 - Math.exp(-this.rotationLerpSpeed * 0.35 * dt);
        let newVx = this.body.velocity.x + (targetVx - this.body.velocity.x) * airLerp;
        let newVz = this.body.velocity.z + (targetVz - this.body.velocity.z) * airLerp;
        const newSpeed = Math.sqrt(newVx * newVx + newVz * newVz);
        if (newSpeed > this._airborneSpeedCap && newSpeed > 0.0001) {
          const scale = this._airborneSpeedCap / newSpeed;
          newVx *= scale;
          newVz *= scale;
        }
        this.body.velocity.x = newVx;
        this.body.velocity.z = newVz;
      }

      // --- Face the direction of travel ----------------------------
      // The character's yaw is derived from the world-space movement
      // vector, NOT from the camera's forward. So walking "left" relative
      // to the camera makes the character face left, walking "back"
      // makes them turn around and face the camera, and so on — the
      // model always points where it's actually going.
      //
      // atan2(x, z) maps the XZ movement direction to a Y-axis rotation;
      // we smooth toward it with a framerate-independent exponential
      // ease so quick changes of direction don't snap the mesh.
      const targetYaw = Math.atan2(moveDir.x, moveDir.z);
      // Shortest-arc interpolation: wrap the delta into [-π, π] so
      // turning from, say, +170° to -170° goes the short way around
      // instead of spinning almost a full turn the long way.
      let delta = targetYaw - this._currentYaw;
      delta = ((delta + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      const turnLerp = 1 - Math.exp(-this.rotationLerpSpeed * dt);
      this._currentYaw += delta * turnLerp;
    } else {
      // No input: ease horizontal velocity to rest. Framerate-independent
      // (a flat "*0.8 per frame" would stop faster at low framerates and
      // slower at high ones — this converges at the same rate regardless).
      const decel = 1 - Math.exp(-12 * dt);
      this.body.velocity.x *= 1 - decel;
      this.body.velocity.z *= 1 - decel;

      // Airborne safety: even while decelerating with no input, never
      // let residual horizontal speed exceed the takeoff snapshot.
      if (!grounded) {
        const hs = Math.sqrt(
          this.body.velocity.x * this.body.velocity.x +
          this.body.velocity.z * this.body.velocity.z
        );
        if (hs > this._airborneSpeedCap && hs > 0.0001) {
          const scale = this._airborneSpeedCap / hs;
          this.body.velocity.x *= scale;
          this.body.velocity.z *= scale;
        }
      }

      // When idle, keep the character facing the same direction as the
      // camera — this matches the pre-existing behavior and means the
      // player isn't stuck facing a stale direction while standing still.
      // (When moving, the "face the direction of travel" logic above wins.)
      const camYaw = Math.atan2(camForward.x, camForward.z);
      let delta = camYaw - this._currentYaw;
      delta = ((delta + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      const turnLerp = 1 - Math.exp(-this.rotationLerpSpeed * dt);
      this._currentYaw += delta * turnLerp;
    }

    // Apply the eased yaw as the mesh's rotation. We compose it as a
    // quaternion so downstream code (slerp-based animation blending)
    // keeps working exactly as before.
    this._targetQuaternion.setFromAxisAngle(new THREE.Vector3(0, 1, 0), this._currentYaw);
    this.mesh.quaternion.copy(this._targetQuaternion);

    // Sync visual mesh position to the physics body BEFORE running
    // animation/pants-rig updates below, so bone world-space reads this
    // frame reflect the character's current position, not last frame's.
    // The physics body's position is its cylinder's *center*, while the
    // mesh's group origin is the character's *feet* — convert between the
    // two using half the collider height instead of a magic number.
    const feetY = this.body.position.y - this.colliderHeight / 2;
    this.mesh.position.set(this.body.position.x, feetY, this.body.position.z);

    this._updateLocomotionAnimation(moveVector, hasInput, dt, sprinting);
  }

  /**
   * Drives whichever visual is currently active:
   *  - Procedural placeholder: a simple direction-agnostic leg/arm swing
   *    (the primitives don't have distinct forward/back/strafe poses).
   *    Sprinting increases stride frequency and swing amplitude.
   *  - Real FBX model: crossfades between the four loaded clips based on
   *    which axis the input is pushing, relative to the locked facing.
   *    (The clip set is walk-speed only, so sprinting just plays it
   *    faster — a true sprint clip would be swapped in the same way.)
   */
  _updateLocomotionAnimation(moveVector, hasInput, dt, sprinting = false) {
    const speedMultiplier = sprinting ? 1.6 : 1;

    // --- Procedural placeholder swing ---
    this._swingAmount = THREE.MathUtils.lerp(
      this._swingAmount,
      hasInput ? 1 : 0,
      1 - Math.exp(-8 * dt)
    );
    if (hasInput) this._walkCycleTime += dt * 8 * speedMultiplier; // stride frequency
    if (this.legs) {
      const swingAmp = 0.5 * (sprinting ? 1.25 : 1.0);
      const swing = Math.sin(this._walkCycleTime) * swingAmp * this._swingAmount;
      this.legs[0].rotation.x = swing;
      this.legs[1].rotation.x = -swing;
    }
    if (this.arms) {
      const swingAmp = 0.35 * (sprinting ? 1.4 : 1.0);
      const swing = Math.sin(this._walkCycleTime) * swingAmp * this._swingAmount;
      this.arms[0].rotation.x = -swing;
      this.arms[1].rotation.x = swing;
    }

    // --- Real model: crossfade between the four loaded FBX clips ---
    // Because the mesh now always faces the direction of travel, the
    // movement input is always "forward" in the character's local frame
    // when moving — so we just play the forward walk clip whenever
    // there's input. (If dedicated strafe/back clips are wanted again
    // later, switch on the input vector's sign here.)
    if (this.mixer && this.locomotionActions) {
      let target = null;
      if (hasInput) {
        target = this.locomotionActions.walk;
      }
      if (target !== this._currentAction) {
        const FADE = 0.2;
        if (this._currentAction) this._currentAction.fadeOut(FADE);
        if (target) target.reset().fadeIn(FADE).play();
        this._currentAction = target;
      }
      // Play faster when sprinting (no dedicated sprint clip in this set).
      if (target) target.timeScale = speedMultiplier;
      this.mixer.update(dt);
      this.realModel.updateMatrixWorld(true);
      this._updatePantsRig();
    }
  }
}

/* ====================================================================
   6. THIRD-PERSON ORBIT CAMERA RIG
   Drag the mouse to rotate around the character (yaw + pitch), scroll
   to zoom in/out. The character's movement direction is derived from
   the camera's actual world-forward vector (see Character#update), so
   rotating the camera here is also how the player steers — no separate
   "turn" input needed.
==================================================================== */
class CameraRig {
  constructor(camera, target, domElement) {
    this.camera = camera;
    this.target = target;
    this.domElement = domElement;

    this.distance = 7;
    this.minDistance = 2.5;
    this.maxDistance = 16;
    this.yaw = 0; // radians, rotation around the character
    this.pitch = 0.35; // radians above the horizontal
    this.minPitch = 0.1; // don't let the camera flip under the ground
    this.maxPitch = 1.3; // or go fully overhead
    this.lookOffset = new THREE.Vector3(0, 1.2, 0); // aim roughly at chest height, not the feet

    this._dragging = false;
    this._lastX = 0;
    this._lastY = 0;
    this._bindEvents();
  }

  _bindEvents() {
    // Drag (mouse button held) to orbit. Bound to the canvas for starting
    // a drag, but move/up are on window so dragging still works even if
    // the cursor leaves the canvas mid-drag.
    this.domElement.addEventListener("mousedown", (e) => {
      this._dragging = true;
      this._lastX = e.clientX;
      this._lastY = e.clientY;
    });
    window.addEventListener("mouseup", () => {
      this._dragging = false;
    });
    window.addEventListener("mousemove", (e) => {
      if (!this._dragging) return;
      const dx = e.clientX - this._lastX;
      const dy = e.clientY - this._lastY;
      this._lastX = e.clientX;
      this._lastY = e.clientY;
      const ROTATE_SPEED = 0.006;
      this.yaw -= dx * ROTATE_SPEED;
      this.pitch = THREE.MathUtils.clamp(
        this.pitch - dy * ROTATE_SPEED,
        this.minPitch,
        this.maxPitch
      );
    });

    // Scroll to zoom. preventDefault stops the page itself from scrolling.
    this.domElement.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        const ZOOM_SPEED = 0.01;
        this.distance = THREE.MathUtils.clamp(
          this.distance + e.deltaY * ZOOM_SPEED,
          this.minDistance,
          this.maxDistance
        );
      },
      { passive: false }
    );

    // --- Touch: single-finger drag to rotate, two-finger pinch to zoom ---
    // Touches starting on the joystick or jump button never reach here —
    // those are separate DOM elements, not descendants of the canvas, so
    // a touchstart on them simply never bubbles to this listener.
    const ROTATE_SPEED = 0.006;
    let rotateTouchId = null;
    let pinchStartDist = null;
    let pinchStartDistance = null;

    const touchDistance = (t0, t1) => {
      const dx = t0.clientX - t1.clientX;
      const dy = t0.clientY - t1.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    };

    this.domElement.addEventListener(
      "touchstart",
      (e) => {
        if (e.touches.length === 1) {
          const touch = e.touches[0];
          rotateTouchId = touch.identifier;
          this._lastX = touch.clientX;
          this._lastY = touch.clientY;
        } else if (e.touches.length === 2) {
          // A second finger landing mid-drag switches to pinch-zoom instead.
          rotateTouchId = null;
          pinchStartDist = touchDistance(e.touches[0], e.touches[1]);
          pinchStartDistance = this.distance;
        }
        e.preventDefault();
      },
      { passive: false }
    );

    window.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length === 2 && pinchStartDist !== null) {
          const dist = touchDistance(e.touches[0], e.touches[1]);
          // Fingers moving apart (dist grows) should zoom IN (distance
          // shrinks), hence the inverted ratio below.
          const ratio = pinchStartDist / dist;
          this.distance = THREE.MathUtils.clamp(
            pinchStartDistance * ratio,
            this.minDistance,
            this.maxDistance
          );
          e.preventDefault();
          return;
        }
        if (rotateTouchId === null) return;
        for (const touch of e.changedTouches) {
          if (touch.identifier !== rotateTouchId) continue;
          const dx = touch.clientX - this._lastX;
          const dy = touch.clientY - this._lastY;
          this._lastX = touch.clientX;
          this._lastY = touch.clientY;
          this.yaw -= dx * ROTATE_SPEED;
          this.pitch = THREE.MathUtils.clamp(
            this.pitch - dy * ROTATE_SPEED,
            this.minPitch,
            this.maxPitch
          );
          e.preventDefault();
        }
      },
      { passive: false }
    );

    const endTouch = (e) => {
      for (const touch of e.changedTouches) {
        if (touch.identifier === rotateTouchId) rotateTouchId = null;
      }
      if (e.touches.length < 2) {
        pinchStartDist = null;
        pinchStartDistance = null;
      }
    };
    window.addEventListener("touchend", endTouch);
    window.addEventListener("touchcancel", endTouch);
  }

  /** The camera's current forward direction on the XZ plane, from yaw alone. */
  getForward() {
    return new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw));
  }

  update(dt) {
    const forward = this.getForward();
    const horizontalDist = this.distance * Math.cos(this.pitch);
    const height = this.distance * Math.sin(this.pitch);

    const lookAtPoint = this.target.mesh.position.clone().add(this.lookOffset);
    const desiredPos = lookAtPoint.clone().addScaledVector(forward, -horizontalDist);
    desiredPos.y += height;

    this.camera.position.lerp(desiredPos, 1 - Math.exp(-10 * dt));
    this.camera.lookAt(lookAtPoint);
  }
}

/* ====================================================================
   7. GAME LOOP / BOOTSTRAP
==================================================================== */
class Game {
  constructor() {
    this.sceneManager = new SceneManager();
    this.physicsManager = new PhysicsManager();
    this.inputManager = new InputManager();

    const hud = document.getElementById("debug-hud");
    const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
    hud.textContent = isTouch
      ? "Joystick move · double-tap center to SPRINT · JUMP · drag to look"
      : "WASD move · Shift toggle sprint · Space jump · drag to rotate · scroll zoom";

    this.character = new Character(this.sceneManager, this.physicsManager);

    // -----------------------------------------------------------------
    // TREES — placed after both the scene and the physics world exist,
    // since the TreeSystem needs to add meshes to the scene AND static
    // colliders to the physics world. Tunables:
    //   count       — total tree count
    //   spawnRadius — no trees closer than this to the origin
    //   minSpacing  — minimum distance between any two trunks
    //   extent      — half-width of the forest square (centered on origin)
    // -----------------------------------------------------------------
    this.treeSystem = new TreeSystem(this.sceneManager.scene, this.physicsManager, {
      count: 380,
      spawnRadius: 14,
      minSpacing: 3.2,
      extent: 90,
    });

    const canvas = document.getElementById("game-canvas");
    this.cameraRig = new CameraRig(this.sceneManager.camera, this.character, canvas);

    // Future systems — instantiated now so other code can register
    // against them, even though they don't do much yet.
    this.interactionSystem = new InteractionSystem(this.character);
    this.inventorySystem = new InventorySystem();

    this._clock = new THREE.Clock();
    this._loop = this._loop.bind(this);
  }

  start() {
    this._loop();
  }

  _loop() {
    requestAnimationFrame(this._loop);

    const dt = Math.min(this._clock.getDelta(), 1 / 30); // clamp to avoid huge steps on tab-switch

    this.physicsManager.step(dt);

    const moveVector = this.inputManager.getMoveVector();
    if (this.inputManager.consumeJump()) this.character.jump();
    this.character.update(
      moveVector,
      this.sceneManager.camera,
      dt,
      this.inputManager.isSprinting()
    );
    this.interactionSystem.update(this.inputManager);

    this.cameraRig.update(dt);

    this.sceneManager.render();
  }
}

const game = new Game();
game.start();
</script>
