<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Comms Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0d13;
    --panel: #12151e;
    --panel-alt: #191d29;
    --border: #262b3a;
    --text: #e8eaf0;
    --text-dim: #868ca3;
    --accent: #7c5cff;
    --accent-soft: rgba(124, 92, 255, 0.15);
    --live: #ff4d6d;
    --live-soft: rgba(255, 77, 109, 0.18);
    --online: #34e0c9;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: radial-gradient(circle at 20% -10%, #171b2b 0%, var(--bg) 55%);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .deck {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 82vh;
    max-height: 720px;
  }

  .deck-header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(180deg, var(--panel-alt), var(--panel));
  }

  .deck-header h1 {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    margin: 0;
  }

  .deck-header .id-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(124,92,255,0.35);
  }

  .status-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--online);
    box-shadow: 0 0 8px var(--online);
  }

  #chatBox {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #chatBox::-webkit-scrollbar { width: 8px; }
  #chatBox::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .msg {
    display: flex;
    gap: 8px;
    align-items: baseline;
    font-size: 14px;
    line-height: 1.45;
    animation: rise 0.18s ease-out;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .pid {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    flex-shrink: 0;
  }

  .msg.self .pid { color: var(--online); }

  .msg .text { color: var(--text); word-break: break-word; }

  .msg.system {
    color: var(--text-dim);
    font-size: 12px;
    font-style: italic;
    justify-content: center;
    text-align: center;
  }

  .speaking-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--live);
    background: var(--live-soft);
    padding: 3px 9px;
    border-radius: 999px;
    margin: 0 20px 4px;
    width: fit-content;
  }

  .speaking-tag .wave {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--live);
    animation: pulse 0.9s infinite ease-in-out;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(0.6); opacity: 0.5; }
    50% { transform: scale(1); opacity: 1; }
  }

  .composer {
    border-top: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    background: var(--panel-alt);
  }

  #msgInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }

  #msgInput:focus { border-color: var(--accent); }

  button {
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-weight: 600;
  }

  #sendBtn {
    background: var(--accent);
    color: white;
    padding: 0 18px;
    border-radius: 12px;
    font-size: 14px;
    transition: filter 0.15s, transform 0.1s;
  }

  #sendBtn:hover { filter: brightness(1.1); }
  #sendBtn:active { transform: scale(0.96); }

  #voiceBtn {
    position: relative;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }

  #voiceBtn svg { width: 20px; height: 20px; }

  #voiceBtn.recording {
    background: var(--live-soft);
    border-color: var(--live);
    color: var(--live);
    transform: scale(0.96);
  }

  #voiceBtn.recording::after {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 16px;
    border: 2px solid var(--live);
    opacity: 0.5;
    animation: ring 1s infinite;
  }

  @keyframes ring {
    0% { transform: scale(0.9); opacity: 0.6; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  .hint {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    padding: 6px 0 14px;
  }

  .hint kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: 'JetBrains Mono', monospace;
  }
</style>
</head>
<body>

<div class="deck">
  <div class="deck-header">
    <div>
      <h1>Comms Deck</h1>
      <div class="status-row"><span class="status-dot"></span><span id="playerCount">connecting…</span></div>
    </div>
    <div class="id-badge" id="idBadge">…</div>
  </div>

  <div id="chatBox"></div>
  <div id="speakingIndicators"></div>

  <div class="composer">
    <input id="msgInput" type="text" placeholder="Say something…" autocomplete="off" maxlength="500" />
    <button id="sendBtn">Send</button>
    <button id="voiceBtn" title="Hold to talk">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
    </button>
  </div>
  <div class="hint">Hold <kbd>Space</kbd> or the mic button to talk · Chrome/Edge/Firefox recommended for voice</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

socket.on('connect', () => console.log('[socket] connected, id:', socket.id));
socket.on('disconnect', (reason) => console.warn('[socket] disconnected:', reason));
socket.on('connect_error', (err) => console.error('[socket] connect_error:', err.message));

let myId = null;
const chatBox = document.getElementById('chatBox');
const playerCountEl = document.getElementById('playerCount');
const idBadge = document.getElementById('idBadge');
const msgInput = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');
const voiceBtn = document.getElementById('voiceBtn');
const speakingIndicators = document.getElementById('speakingIndicators');

function addMessage({ id, text, system, self }) {
  const row = document.createElement('div');
  row.className = 'msg' + (system ? ' system' : '') + (self ? ' self' : '');
  if (system) {
    row.textContent = text;
  } else {
    const pid = document.createElement('span');
    pid.className = 'pid';
    pid.textContent = `[${id}]`;
    const body = document.createElement('span');
    body.className = 'text';
    body.textContent = text;
    row.appendChild(pid);
    row.appendChild(body);
  }
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

// ---- Socket lifecycle ----
socket.on('init', ({ id, playerCount }) => {
  myId = id;
  idBadge.textContent = id;
  playerCountEl.textContent = `${playerCount} online`;
  addMessage({ text: 'Connected to the deck.', system: true });
});

socket.on('player-joined', ({ id, playerCount }) => {
  playerCountEl.textContent = `${playerCount} online`;
  addMessage({ text: `${id} joined`, system: true });
});

socket.on('player-left', ({ id, playerCount }) => {
  playerCountEl.textContent = `${playerCount} online`;
  addMessage({ text: `${id} left`, system: true });
  endRemoteVoice(id);
});

// ---- Text chat ----
socket.on('chat-message', ({ id, text }) => {
  addMessage({ id, text, self: id === myId });
});

function sendMessage() {
  const text = msgInput.value.trim();
  if (!text) return;
  socket.emit('chat-message', text);
  msgInput.value = '';
}

sendBtn.addEventListener('click', sendMessage);
msgInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

// ================= Voice (push-to-talk) =================
// Sender side: MediaRecorder streams small chunks over the socket as they're produced.
// Receiver side: chunks are fed into a MediaSource per remote speaker for live playback.
// Note: relies on MediaSource + MediaRecorder support for webm/opus (Chrome, Edge, Firefox).
// Safari's MediaSource support for this codec is unreliable, so voice may not play there.

const VOICE_MIME_CANDIDATES = [
  'audio/webm;codecs=opus',
  'audio/webm',
  'audio/ogg;codecs=opus'
];

function pickSupportedMime() {
  for (const type of VOICE_MIME_CANDIDATES) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(type)) return type;
  }
  return '';
}

const voiceMime = pickSupportedMime();
let localStream = null;
let mediaRecorder = null;
let isRecording = false;
let chunkCount = 0;

// --- Diagnostics: run once at load so support/permission problems are obvious ---
console.log('[voice] secure context (required for mic access):', window.isSecureContext);
console.log('[voice] navigator.mediaDevices available:', !!navigator.mediaDevices);
console.log('[voice] MediaRecorder mime type picked:', voiceMime || '(none supported!)');
console.log('[voice] MediaSource available (needed to hear others):', 'MediaSource' in window);

async function startRecording() {
  console.log('[voice] startRecording() called — isRecording:', isRecording);
  if (isRecording) return;

  if (!window.isSecureContext) {
    console.error('[voice] Blocked: page is not a secure context (needs https:// or localhost).');
    addMessage({ text: 'Voice requires HTTPS or localhost — mic access is blocked on this origin.', system: true });
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    console.error('[voice] Blocked: navigator.mediaDevices.getUserMedia is unavailable.');
    addMessage({ text: 'This browser does not expose microphone access.', system: true });
    return;
  }
  if (!voiceMime) {
    console.error('[voice] Blocked: no supported MediaRecorder mime type.');
    addMessage({ text: 'Voice chat is not supported in this browser.', system: true });
    return;
  }

  try {
    if (!localStream) {
      console.log('[voice] requesting microphone permission…');
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      console.log('[voice] microphone granted. Tracks:', localStream.getAudioTracks().map(t => t.label || '(unnamed track)'));
    }

    mediaRecorder = new MediaRecorder(localStream, { mimeType: voiceMime });
    isRecording = true;
    chunkCount = 0;
    voiceBtn.classList.add('recording');
    console.log('[voice] MediaRecorder created, state:', mediaRecorder.state, '— emitting voice-start. socket.connected:', socket.connected);
    socket.emit('voice-start');

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) {
        chunkCount++;
        console.log(`[voice] chunk #${chunkCount}: ${e.data.size} bytes — sending`);
        e.data.arrayBuffer().then((buf) => socket.emit('voice-chunk', buf));
      } else {
        console.warn('[voice] ondataavailable fired with an empty chunk (0 bytes) — mic may not be capturing audio.');
      }
    };
    mediaRecorder.onerror = (e) => {
      console.error('[voice] MediaRecorder error:', e.error || e);
    };
    mediaRecorder.onstop = () => {
      console.log(`[voice] recording stopped after ${chunkCount} chunk(s) — emitting voice-end`);
      socket.emit('voice-end');
    };

    mediaRecorder.start(250); // emit a chunk every 250ms for low-latency streaming
  } catch (err) {
    console.error('[voice] Mic access failed:', err.name, err.message);
    addMessage({ text: `Microphone access denied or unavailable (${err.name}).`, system: true });
    isRecording = false;
    voiceBtn.classList.remove('recording');
  }
}

function stopRecording() {
  if (!isRecording) return;
  console.log('[voice] stopRecording() called');
  isRecording = false;
  voiceBtn.classList.remove('recording');
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

// Resume the AudioContext on the very first user interaction, so remote
// voice playback works even for someone who only listens and never talks.
document.addEventListener('click', () => getAudioContext(), { once: true });

// Push-to-talk via button (mouse + touch)
voiceBtn.addEventListener('mousedown', startRecording);
voiceBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startRecording(); });
['mouseup', 'mouseleave', 'touchend', 'touchcancel'].forEach((evt) => {
  voiceBtn.addEventListener(evt, stopRecording);
});

// Push-to-talk via spacebar (ignored while typing in the input)
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !e.repeat && document.activeElement !== msgInput) {
    e.preventDefault();
    startRecording();
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    stopRecording();
  }
});

// ---- Receiving remote voice ----
// MediaRecorder captures mic input quietly by default, so we route every
// incoming <audio> element through a Web Audio GainNode to boost the volume.
const REMOTE_VOICE_GAIN = 2.5; // 1.0 = original volume, raise/lower to taste

let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  // Browsers suspend new contexts until a user gesture; this is called from
  // startRecording (a click/keypress), so it's safe to resume here too.
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

// Wires an <audio> element through: source -> gain -> speakers.
// Once an element is routed this way, its own default output is silenced
// and only the boosted signal (via the gain node) reaches the speakers.
function attachGain(audioEl) {
  const ctx = getAudioContext();
  const source = ctx.createMediaElementSource(audioEl);
  const gainNode = ctx.createGain();
  gainNode.gain.value = REMOTE_VOICE_GAIN;
  source.connect(gainNode).connect(ctx.destination);
  return gainNode;
}

const remoteVoices = new Map(); // shortId -> { mediaSource, sourceBuffer, audio, gainNode, queue, tagEl }

function showSpeakingTag(id) {
  if (document.getElementById(`tag-${id}`)) return;
  const tag = document.createElement('div');
  tag.className = 'speaking-tag';
  tag.id = `tag-${id}`;
  tag.innerHTML = `<span class="wave"></span> ${id} speaking…`;
  speakingIndicators.appendChild(tag);
  return tag;
}

function hideSpeakingTag(id) {
  const tag = document.getElementById(`tag-${id}`);
  if (tag) tag.remove();
}

function flushQueue(id) {
  const entry = remoteVoices.get(id);
  if (!entry || !entry.sourceBuffer || entry.sourceBuffer.updating) return;
  if (entry.queue.length === 0) return;
  const next = entry.queue.shift();
  try {
    entry.sourceBuffer.appendBuffer(new Uint8Array(next));
  } catch (err) {
    console.error('appendBuffer failed:', err);
  }
}

function endRemoteVoice(id) {
  const entry = remoteVoices.get(id);
  if (!entry) return;
  hideSpeakingTag(id);
  const tryFinish = () => {
    if (entry.queue.length > 0 || (entry.sourceBuffer && entry.sourceBuffer.updating)) {
      setTimeout(tryFinish, 100);
      return;
    }
    try {
      if (entry.mediaSource.readyState === 'open') entry.mediaSource.endOfStream();
    } catch (e) { /* ignore */ }
    setTimeout(() => {
      entry.audio.remove();
      remoteVoices.delete(id);
    }, 1500);
  };
  tryFinish();
}

socket.on('voice-start', ({ id }) => {
  if (!voiceMime || !('MediaSource' in window)) return;
  if (remoteVoices.has(id)) endRemoteVoice(id); // clean up any stale session

  const audio = new Audio();
  audio.autoplay = true;
  audio.style.display = 'none';
  document.body.appendChild(audio);

  const mediaSource = new MediaSource();
  audio.src = URL.createObjectURL(mediaSource);

  const gainNode = attachGain(audio);

  const entry = { mediaSource, sourceBuffer: null, audio, gainNode, queue: [] };
  remoteVoices.set(id, entry);

  mediaSource.addEventListener('sourceopen', () => {
    try {
      const sb = mediaSource.addSourceBuffer(voiceMime);
      entry.sourceBuffer = sb;
      sb.addEventListener('updateend', () => flushQueue(id));
      flushQueue(id);
    } catch (err) {
      console.error('addSourceBuffer failed:', err);
    }
  }, { once: true });

  showSpeakingTag(id);
});

socket.on('voice-chunk', ({ id, chunk }) => {
  let entry = remoteVoices.get(id);
  if (!entry) return; // ignore chunks with no active session (e.g. arrived before voice-start)
  entry.queue.push(chunk);
  flushQueue(id);
});

socket.on('voice-end', ({ id }) => {
  endRemoteVoice(id);
});
</script>
</body>
</html>
