  registerInteractable(o) { this.interactables.push(o); }
  update() {}
}

/* ====================================================================
   CAMERA RIG
   ------------------------------------------------------------------
   TOUCH FIX: the previous version listened on `window` for touchmove
   and checked `e.touches.length === 2` to enter pinch-zoom. But
   `e.touches` contains ALL touches on the page, including the one
   on the virtual joystick. So while walking (one thumb on the
   joystick) and dragging to rotate (other thumb on the canvas), the
   code saw 2 touches and triggered a pinch — zooming instead of
   rotating.

   Fix: track which touch identifiers STARTED on the canvas. Only
   those count toward rotation and pinch. Touches that began on the
   joystick or jump button are ignored by the camera.
==================================================================== */
class CameraRig {
  constructor(camera, target, domElement) {
    this.camera = camera; this.target = target; this.domElement = domElement;
    this.distance = 7; this.minDistance = 2.5; this.maxDistance = 16;
    this.yaw = 0; this.pitch = 0.35;
    this.minPitch = 0.1; this.maxPitch = 1.3;
    this.lookOffset = new THREE.Vector3(0, 1.2, 0);
    this._dragging = false; this._lastX = 0; this._lastY = 0;
    this._bindEvents();
  }

  _bindEvents() {
    // ---- Mouse ----
    this.domElement.addEventListener("mousedown", (e) => {
      this._dragging = true;
      this._lastX = e.clientX; this._lastY = e.clientY;
    });
    window.addEventListener("mouseup", () => { this._dragging = false; });
    window.addEventListener("mousemove", (e) => {
      if (!this._dragging) return;
      const dx = e.clientX - this._lastX, dy = e.clientY - this._lastY;
      this._lastX = e.clientX; this._lastY = e.clientY;
      const S = 0.006;
      this.yaw -= dx * S;
      this.pitch = THREE.MathUtils.clamp(this.pitch - dy * S, this.minPitch, this.maxPitch);
    });
    this.domElement.addEventListener("wheel", (e) => {
      e.preventDefault();
      const S = 0.01;
      this.distance = THREE.MathUtils.clamp(this.distance + e.deltaY * S, this.minDistance, this.maxDistance);
    }, { passive: false });

    // ---- Touch ----
    const ROTATE_SPEED = 0.006;
    const td = (a, b) => Math.sqrt((a.clientX - b.clientX)**2 + (a.clientY - b.clientY)**2);

    // Identifiers of touches that started ON THE CANVAS. Only these
    // participate in camera rotation and pinch-zoom. Touches on the
    // joystick / jump button / inventory are ignored.
    const canvasTouchIds = new Set();

    let rotateTouchId = null;
    let pinchStartDist = null;
    let pinchStartDistance = null;

    const getCanvasTouches = (list) => {
      const out = [];
      for (const t of list) if (canvasTouchIds.has(t.identifier)) out.push(t);
      return out;
    };

    // touchstart is bound to the CANVAS, so its changedTouches are
    // exactly the touches that began on the canvas — no filtering
    // needed there. But we still add them to the tracked set so
    // touchmove (on window) can distinguish ours from the joystick's.
    this.domElement.addEventListener("touchstart", (e) => {
      for (const t of e.changedTouches) canvasTouchIds.add(t.identifier);

      const canvasTouches = getCanvasTouches(e.touches);

      if (canvasTouches.length === 1) {
        // Single canvas touch: start rotating.
        rotateTouchId = canvasTouches[0].identifier;
        this._lastX = canvasTouches[0].clientX;
        this._lastY = canvasTouches[0].clientY;
        pinchStartDist = null;
      } else if (canvasTouches.length === 2) {
        // A second canvas finger landed mid-drag: switch to pinch.
        rotateTouchId = null;
        pinchStartDist = td(canvasTouches[0], canvasTouches[1]);
        pinchStartDistance = this.distance;
      }
      // If canvasTouches.length > 2, ignore (three-finger gestures
      // are not part of the spec; they'll just do nothing).
      e.preventDefault();
    }, { passive: false });

    // touchmove is bound to WINDOW so drags still work if the finger
    // slides off the canvas. But we filter by canvasTouchIds to ignore
    // joystick / button touches.
    window.addEventListener("touchmove", (e) => {
      const canvasTouches = getCanvasTouches(e.touches);

      // Two canvas touches → pinch-zoom.
      if (canvasTouches.length === 2 && pinchStartDist !== null) {
        const d = td(canvasTouches[0], canvasTouches[1]);
        const r = pinchStartDist / d;
        this.distance = THREE.MathUtils.clamp(pinchStartDistance * r, this.minDistance, this.maxDistance);
        e.preventDefault();
        return;
      }

      // One canvas touch and no pinch → rotate.
      if (rotateTouchId === null) return;
      if (!canvasTouchIds.has(rotateTouchId)) return;
      for (const t of e.changedTouches) {
        if (t.identifier !== rotateTouchId) continue;
        if (!canvasTouchIds.has(t.identifier)) continue;
        const dx = t.clientX - this._lastX, dy = t.clientY - this._lastY;
        this._lastX = t.clientX; this._lastY = t.clientY;
        this.yaw -= dx * ROTATE_SPEED;
        this.pitch = THREE.MathUtils.clamp(this.pitch - dy * ROTATE_SPEED, this.minPitch, this.maxPitch);
        e.preventDefault();
      }
    }, { passive: false });

    const endT = (e) => {
      for (const t of e.changedTouches) {
        canvasTouchIds.delete(t.identifier);
        if (t.identifier === rotateTouchId) rotateTouchId = null;
      }

      // Re-evaluate state: if we just lifted one finger but still
      // have exactly one canvas touch down, resume rotating with it.
      const remaining = [];
      for (const t of e.touches) if (canvasTouchIds.has(t.identifier)) remaining.push(t);

      if (remaining.length === 1) {
        rotateTouchId = remaining[0].identifier;
        this._lastX = remaining[0].clientX;
        this._lastY = remaining[0].clientY;
      } else if (remaining.length === 0) {
        rotateTouchId = null;
      }

      if (remaining.length < 2) {
        pinchStartDist = null;
        pinchStartDistance = null;
      }
    };
    window.addEventListener("touchend", endT);
    window.addEventListener("touchcancel", endT);
  }

  getForward() { return new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw)); }

  update(dt) {
    const forward = this.getForward();
    const hd = this.distance * Math.cos(this.pitch);
    const h = this.distance * Math.sin(this.pitch);
    const lookAt = this.target.mesh.position.clone().add(this.lookOffset);
    const desired = lookAt.clone().addScaledVector(forward, -hd);
    desired.y += h;
    this.camera.position.lerp(desired, 1 - Math.exp(-10 * dt));
    this.camera.lookAt(lookAt);
  }
}

class Game {
  constructor() {
    this.sceneManager = new SceneManager();
    this.physicsManager = new PhysicsManager();
    this.inputManager = new InputManager();

    const hud = document.getElementById("debug-hud");
    const isTouch = "ontouchstart" in window || navigator.maxTouchPoints > 0;
    hud.textContent = isTouch
      ? "Joystick · 2-tap centre = SPRINT · JUMP · drag to look"
      : "WASD · Shift sprint · Space jump · drag rotate · scroll zoom";

    this.character = new Character(this.sceneManager, this.physicsManager);

    this.treeSystem = new TreeSystem(this.sceneManager.scene, this.physicsManager, {
      count: 380, spawnRadius: 14, minSpacing: 3.2, extent: 90,
    });

    this.worldItems = new WorldItems(this.sceneManager.scene);
    this.worldItems.scatter(this.treeSystem.getPlacements(), {
      stickCount: 35, stoneCount: 30,
      minRadius: 6, maxRadius: 55,
      treeClearance: 2.0, itemSpacing: 1.5,
    });

    this.inventorySystem = new InventorySystem();
    this.interactionSystem = new InteractionSystem(this.character);

    this.craftingSystem = new CraftingSystem({
      inventory: this.inventorySystem,
      worldItems: this.worldItems,
      sceneManager: this.sceneManager,
    });

    const canvas = document.getElementById("game-canvas");
    this.cameraRig = new CameraRig(this.sceneManager.camera, this.character, canvas);

    this._pickupBtn = document.getElementById("pickup-prompt");
    this._dropBtn   = document.getElementById("drop-button");
    this._stripBtn  = document.getElementById("strip-button");
    this._stripFill = document.getElementById("strip-fill");
    this._stripText = document.getElementById("strip-text");
    this._stripBadge= document.getElementById("strip-badge");
    this._weightEl  = document.getElementById("weight-indicator");
    this._lastNearbyItem = null;

    this.nearbyTree = null;
    this.stripTarget = null;
    this.stripProgress = 0;
    this.stripDuration = 0;
    this.TREE_INTERACT_RADIUS = 2.6;
    this.TREE_CANCEL_RADIUS   = 3.2;
    this.BARK_HAND_TIME       = 3.0;
    this.BARK_HATCHET_TIME    = 0.8;

    this._bindUI();

    this._clock = new THREE.Clock();
    this._loop = this._loop.bind(this);
  }

  _bindUI() {
    for (let i = 0; i < this.inventorySystem.SLOT_COUNT; i++) {
      const el = document.querySelector(`.inv-slot[data-index="${i}"]`);
      if (!el) continue;
      el.addEventListener("click", (e) => {
        e.preventDefault();
        this.inventorySystem.selectSlot(i);
      });
    }

    this._pickupBtn.addEventListener("click", (e) => { e.preventDefault(); this._onPickupClick(); });
    this._dropBtn.addEventListener("click", (e) => { e.preventDefault(); this._onDropClick(); });
    this._stripBtn.addEventListener("click", (e) => { e.preventDefault(); this._onStripClick(); });
  }

  _onPickupClick() {
    const it = this.worldItems.nearbyItem;
    if (!it) return;
    if (this.inventorySystem.addItem(it.type)) {
      this.worldItems.consumeNearby();
    }
  }

  _onDropClick() {
    if (!this.inventorySystem.canDropSelected()) return;
    const idx = this.inventorySystem.selectedSlot;
    const type = this.inventorySystem.removeFromSlot(idx);
    if (!type) return;
    const fwd = this.character.getForwardXZ();
    const px = this.character.body.position.x + fwd.x * 2.5;
    const pz = this.character.body.position.z + fwd.z * 2.5;
    this.worldItems.spawn(type, px, pz);
  }

  _onStripClick() {
    if (this.stripTarget) {
      this._cancelStrip();
      return;
    }
    if (!this.nearbyTree) return;
    if (this.nearbyTree.barkStripped) return;
    if (!this.inventorySystem.hasEmptySlot()) return;

    this.stripTarget = this.nearbyTree;
    this.stripProgress = 0;
    const hasHatchet = this.inventorySystem.hasItem("stone_hatchet");
    this.stripDuration = hasHatchet ? this.BARK_HATCHET_TIME : this.BARK_HAND_TIME;
  }

  _cancelStrip() {
    this.stripTarget = null;
    this.stripProgress = 0;
    this.stripDuration = 0;
  }

  _updateStripping(dt) {
    if (!this.stripTarget) return;

    const p = this.character.body.position;
    const dx = this.stripTarget.x - p.x;
    const dz = this.stripTarget.z - p.z;
    const d2 = dx*dx + dz*dz;

    if (d2 > this.TREE_CANCEL_RADIUS * this.TREE_CANCEL_RADIUS) {
      this._cancelStrip();
      return;
    }

    this.stripProgress += dt;
    if (this.stripProgress >= this.stripDuration) {
      this.inventorySystem.addItem("bark");
      this.treeSystem.markBarkStripped(this.stripTarget);
      this._cancelStrip();
    }
  }

  _updateActionButtons() {
    const nearby = this.worldItems.nearbyItem;
    if (nearby !== this._lastNearbyItem) {
      this._lastNearbyItem = nearby;
      if (nearby) {
        const label = ITEM_LABELS[nearby.type] || nearby.type.toUpperCase();
        this._pickupBtn.textContent = "PICK UP " + label;
        this._pickupBtn.classList.remove("hidden");
      } else {
        this._pickupBtn.classList.add("hidden");
      }
    }
    this._dropBtn.classList.toggle("disabled", !this.inventorySystem.canDropSelected());

    let stripState;
    if (this.stripTarget) stripState = "stripping";
    else if (this.nearbyTree && this.nearbyTree.barkStripped) stripState = "stripped";
    else if (this.nearbyTree) stripState = "ready";
    else stripState = "hidden";

    this._stripBtn.classList.toggle("hidden", stripState === "hidden");
    this._stripBtn.classList.toggle("disabled", stripState === "stripped");
    this._stripFill.style.width = "0%";
    this._stripBadge.textContent = "";

    switch (stripState) {
      case "stripping": {
        const pct = Math.min(100, (this.stripProgress / this.stripDuration) * 100);
        this._stripFill.style.width = pct + "%";
        this._stripText.textContent = "STRIPPING…";
        break;
      }
      case "stripped": {
        this._stripText.textContent = "ALREADY STRIPPED";
        break;
      }
      case "ready": {
        this._stripText.textContent = "STRIP BARK";
        this._stripBadge.textContent =
          this.inventorySystem.hasItem("stone_hatchet") ? "⚒ FAST" : "";
        break;
      }
      default: {
        this._stripText.textContent = "STRIP BARK";
        break;
      }
    }

    const count = this.inventorySystem.getOccupiedSlotCount();
    const pct = Math.round(WEIGHT_SPEED_MULTIPLIER[count] * 100);
    this._weightEl.textContent = `LOAD ${count}/4 · SPEED ${pct}%`;
    this._weightEl.classList.toggle("heavy", count >= 2 && count < 4);
    this._weightEl.classList.toggle("overloaded", count >= 4);
  }

  start() { this._loop(); }

  _loop() {
    requestAnimationFrame(this._loop);
    const dt = Math.min(this._clock.getDelta(), 1 / 30);

    if (this.craftingSystem.active) {
      this.craftingSystem.update(dt);
      this.craftingSystem.render(this.sceneManager.renderer);
      return;
    }

    this.physicsManager.step(dt);

    const occupied = this.inventorySystem.getOccupiedSlotCount();
    const speedMultiplier = WEIGHT_SPEED_MULTIPLIER[occupied] ?? 1.0;

    const moveVector = this.inputManager.getMoveVector();
    if (this.inputManager.consumeJump()) this.character.jump();
    this.character.update(
      moveVector,
      this.sceneManager.camera,
      dt,
      this.inputManager.isSprinting(),
      speedMultiplier
    );

    this.worldItems.update(this.character.body.position);
    this.nearbyTree = this.treeSystem.getNearestTree(
      this.character.body.position.x,
      this.character.body.position.z,
      this.TREE_INTERACT_RADIUS
    );

    this._updateStripping(dt);
    this._updateActionButtons();

    this.interactionSystem.update(this.inputManager);
    this.cameraRig.update(dt);

    this.sceneManager.render();
  }
}

const game = new Game();
game.start();
</script>
